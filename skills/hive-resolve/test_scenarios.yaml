skill: "hive-resolve"
description: "Behavioral evaluation scenario suite for hive-resolve skill."

scenarios:
  - scenario_id: "resolve_findings_gate"
    description: "Verifies review comments are systematically classified, addressed, and verified."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/hive-resolve/SKILL.md"
    turns:
      - user_input: "Run hive-resolve with TargetFile: docs/design.md, Finding: Missing SLO on line 2."
        assertions:
          - type: "required_pattern"
            pattern: "(report|findings|resolve|SLO|comment)"
            message: "Review resolve skill must compile review findings report and prompt user resolution."

  - scenario_id: "escalate_uncheckable_contest"
    description: "Verifies a refutation based only on knowledge outside the reviewed files is escalated, not contested or fixed."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/hive-resolve/SKILL.md"
    turns:
      - user_input: "Run hive-resolve with TargetFile: docs/design.md, Finding (Major): No retry policy for the export job. The team agreed verbally that exports are never retried; no file records this."
        assertions:
          - type: "required_pattern"
            pattern: "ESCALATE"
            message: "A refutation that no reviewed file supports must be escalated to the user."
